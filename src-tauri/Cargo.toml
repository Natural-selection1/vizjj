#:tombi toml-version = "v1.0.0"

[package]
name = "vizjj"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "vizjj - Gui for JJ"

[dependencies]
tauri = { version = "2.0.0", features = ["config-toml"] }
tauri-codegen = "2.0.0"
tauri-macros = "2.0.0"
tauri-plugin = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-log = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-window-state = "2.0.0"
tauri-runtime = "2.0.0"
tauri-runtime-wry = "2.0.0"
tauri-utils = "2.0.0"

jj-cli = { version = "=0.43.0", default-features = false, features = ["git"] }
jj-lib = { version = "=0.43.0", features = ["watchman"] }

# deps shared with JJ, which we try to keep on the same version
anyhow = "1.0.93"
clap = { version = "=4.6.1", features = [
  "deprecated",
  "derive",
  "string",
  "wrap_help"
] }
dunce = "1.0.5"
gix = { version = "=0.85.0", default-features = false, features = [
  "blob-diff",
  "index",
  "max-performance-safe"
] }
indexmap = "=2.14.0"
itertools = "=0.15.0"
pollster = "=0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
toml_edit = { version = "=0.25.12", features = ["serde"] }

# deps used by JJ but with different features
chrono = { version = "=0.4.44", features = ["serde"] }

futures-util = "=0.3.32"
log = "0.4"
# extra deps not used by JJ
opener = { version = "0.8.2", features = ["reveal"] }
ts-rs = { version = "7.1.1", features = ["chrono-impl"], optional = true }

[dev-dependencies]
assert_matches = "1.5"
tempfile = "3.10.1"
zip = "0.6"

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["config-toml"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.54.0", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem"
] }
